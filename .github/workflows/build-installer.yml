name: Build BlazEng Installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Attach the installer to a GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import src; print(src.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Stage FFmpeg and Godot
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin, godot | Out-Null
          Invoke-WebRequest -UseBasicParsing -OutFile "$env:TEMP\ffmpeg.zip" "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Expand-Archive "$env:TEMP\ffmpeg.zip" "$env:TEMP\ffmpeg_x" -Force
          $exe = Get-ChildItem "$env:TEMP\ffmpeg_x" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "ffmpeg.exe not found"; exit 1 }
          Copy-Item $exe.FullName bin\ffmpeg.exe
          Invoke-WebRequest -UseBasicParsing -OutFile "$env:TEMP\godot.zip" "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip"
          Expand-Archive "$env:TEMP\godot.zip" godot -Force

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          pyinstaller BlazEng.spec --clean --noconfirm
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Smoke-test the frozen app
        shell: pwsh
        run: python scripts/smoke_frozen.py dist\BlazEng --expect-bundled ffmpeg,godot

      - name: Compile installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Silent install / uninstall check
        shell: pwsh
        run: |
          $setup = "dist\installer\BlazEng_Setup_${{ steps.ver.outputs.version }}.exe"
          $dir = "$env:RUNNER_TEMP\BlazEngInstall"
          Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir" -Wait
          if (-not (Test-Path "$dir\blazeng-cli.exe")) { Write-Error "CLI not installed"; exit 1 }
          & "$dir\blazeng-cli.exe" version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          Start-Sleep -Seconds 5
          if (Test-Path "$dir\BlazEng.exe") { Write-Error "uninstall left files"; exit 1 }

      - uses: actions/upload-artifact@v7
        with:
          name: BlazEng_Setup_${{ steps.ver.outputs.version }}
          path: dist\installer\BlazEng_Setup_${{ steps.ver.outputs.version }}.exe
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: BlazEng ${{ steps.ver.outputs.version }}
          files: dist\installer\BlazEng_Setup_${{ steps.ver.outputs.version }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
