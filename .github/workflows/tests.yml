name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system Qt dependencies for offscreen PyQt6
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libgl1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        # No API keys needed: the suite is designed to run fully offline
        # via dummy providers, and Gemini-provider tests mock the SDK
        # client rather than hitting the live API.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests/ -v --cov=src/core --cov=src/providers --cov-report=term-missing

      - name: Verify app boots (smoke test)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p /tmp/smoketest && cd /tmp/smoketest
          cp -r $GITHUB_WORKSPACE/* .
          cat > config.yaml << 'EOF'
          storage_path: ./storage
          text_provider: dummy
          vision_provider: dummy
          image_provider: dummy
          gemini_api_key: GEMINI_API_KEY_HERE
          EOF
          python -c "
          import main
          config = main.load_config()
          main.ensure_storage(config)
          director, orchestrator, world_state, asset_manager = main.build_pipeline(config)
          print('Smoke test passed: pipeline builds without error')
          "

  godot-integration:
    # Separate job from the fast unit-test suite above: this downloads a
    # ~78MB Godot binary and does real headless rendering, so it's slower
    # and only worth running on main rather than on every PR push.
    # See tests/test_godot_renderer.py and tests/test_orchestrator.py for
    # what these integration tests actually verify, and ARCHITECTURE.md's
    # "Godot rendering notes" for why the --headless flag alone doesn't
    # work here (real finding from development, not a guess).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (Qt offscreen + Xvfb + Godot's runtime libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libgl1 xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download real Godot binary
        run: |
          curl -sL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot_bin
          chmod +x /tmp/godot_bin/Godot_v4.7.2-stable_linux.x86_64
          echo "BLAZENG_GODOT_BINARY=/tmp/godot_bin/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Run Godot integration tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests/test_godot_renderer.py tests/test_orchestrator.py -v -k "Real"
