name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  metadata:
    # Cheap guards: licence ships everywhere it should, versions agree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Licence is present and referenced
        run: |
          head -1 LICENSE | grep -q "MrMIB License"
          grep -q 'LicenseFile=LICENSE' installer.iss
          grep -q 'license = { file = "LICENSE" }' pyproject.toml
          grep -q '"LICENSE"' pyproject.toml
      - name: Versions agree
        run: |
          py=$(sed -n 's/^__version__ *= *"\(.*\)"/\1/p' src/__init__.py)
          iss=$(sed -n 's/^ *#define *AppVersion *"\(.*\)"/\1/p' installer.iss | head -1)
          echo "package=$py installer=$iss"
          test -n "$py"
          test "$py" = "$iss"
          grep -q "^## \[\?$py" CHANGELOG.md
      - name: Config parses
        run: |
          pip install pyyaml
          python -c "import yaml; yaml.safe_load(open('config.yaml'))"

  portable:
    # Windows/macOS: the render path and per-user paths differ there, so run the
    # suite natively. Experimental until it has been seen green on those runners.
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q
        env:
          QT_QPA_PLATFORM: offscreen

  frozen-linux:
    # Builds the PyInstaller bundle and runs the frozen CLI + GUI in a clean
    # user environment (scripts/smoke_frozen.py).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libxcb-cursor0
      - run: pip install pyinstaller -r requirements.txt
      - run: pyinstaller BlazEng.spec --clean --noconfirm
      - run: python scripts/smoke_frozen.py dist/BlazEng

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system Qt + ffmpeg dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libgl1 ffmpeg espeak-ng

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        id: run_tests
        continue-on-error: true
        # No API keys needed: the suite is designed to run fully offline
        # via dummy providers, and Gemini-provider tests mock the SDK
        # client rather than hitting the live API.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests/ -v --cov=src/core --cov=src/providers --cov-report=term-missing --cov-fail-under=80 2>&1 | tee pytest_output.log
          exit ${PIPESTATUS[0]}

      - name: Commit test log on failure (self-diagnosing)
        # Real cause found via this same mechanism, not flaky: ffmpeg
        # wasn't installed on the runner at all ("ffmpeg binary not found"),
        # and 3.11/3.12 alternating which one showed as the failure was
        # just fail-fast racing -- both would've failed the same way, but
        # whichever matrix job finished first got reported before the
        # other could also fail, so the other showed as cancelled instead.
        # Left this mechanism in place for whatever comes up next.
        if: steps.run_tests.outcome == 'failure'
        run: |
          git config user.email "ci@github-actions.local"
          git config user.name "GitHub Actions CI"
          git fetch origin ci-debug-logs || true
          git checkout -B ci-debug-logs
          cp pytest_output.log "pytest-py${{ matrix.python-version }}-run${{ github.run_number }}.log"
          git add -f "pytest-py${{ matrix.python-version }}-run${{ github.run_number }}.log"
          git commit -m "CI debug log: pytest failure py${{ matrix.python-version }}, run ${{ github.run_number }}"
          git push origin ci-debug-logs --force

      - name: Fail the job if tests actually failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1

      - name: Verify app boots (smoke test)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p /tmp/smoketest && cd /tmp/smoketest
          cp -r $GITHUB_WORKSPACE/* .
          cat > config.yaml << 'EOF'
          storage_path: ./storage
          text_provider: dummy
          vision_provider: dummy
          image_provider: dummy
          gemini_api_key: GEMINI_API_KEY_HERE
          EOF
          python -c "
          import main
          config = main.load_config()
          main.ensure_storage(config)
          director, orchestrator, world_state, asset_manager = main.build_pipeline(config)
          print('Smoke test passed: pipeline builds without error')
          "
          python -m src.cli version
          python -m src.cli doctor || true   # informational: Godot/Blender legitimately absent on this job

  godot-integration:
    # Separate job from the fast unit-test suite above: this downloads a
    # ~78MB Godot binary and does real headless rendering, so it's slower
    # and only worth running on main rather than on every PR push.
    # See tests/test_godot_renderer.py and tests/test_orchestrator.py for
    # what these integration tests actually verify, and ARCHITECTURE.md's
    # "Godot rendering notes" for why the --headless flag alone doesn't
    # work here (real finding from development, not a guess).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install system dependencies (Qt offscreen + Xvfb + Godot's runtime libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libgl1 xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download real Godot binary
        run: |
          curl -sL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot_bin
          chmod +x /tmp/godot_bin/Godot_v4.7.2-stable_linux.x86_64
          echo "BLAZENG_GODOT_BINARY=/tmp/godot_bin/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Run Godot integration tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests/test_godot_renderer.py tests/test_orchestrator.py -v -k "Real"

  blender-integration:
    # Real headless Blender render under Xvfb (EEVEE needs an OpenGL context even
    # with --background; Mesa's software rasteriser provides one on CI runners).
    # Exercises tests/test_blender_renderer.py::TestRealBlender plus a full CLI run
    # (prompt -> Blender frames -> mp4 + otio) with offline dummy providers.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libgl1 xvfb ffmpeg blender espeak-ng python3-numpy  # numpy: Blender's glTF importer

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Blender integration tests (planes, rigged characters, glTF models)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/test_blender_renderer.py tests/test_rigged.py tests/test_consistency.py -v

      - name: End-to-end CLI run with real Blender
        run: |
          python -m src.cli run "A detective finds a clue in a rainy alley." \
            --dummy --speech espeak --renderer blender --characters rigged --resolution 320x180 --fps 6 --json > run.json
          python - <<'PY'
          import json, pathlib
          r = json.load(open("run.json"))
          assert r["video"] and pathlib.Path(r["video"]).stat().st_size > 0, r
          assert r["failures"] == [], r["failures"]
          assert r["audio_shots"], "no dialogue audio was produced"
          import subprocess
          kinds = subprocess.run(["ffprobe", "-v", "error", "-show_entries", "stream=codec_type", "-of", "csv=p=0", r["video"]],
                                 capture_output=True, text=True, check=True).stdout.split()
          assert sorted(kinds) == ["audio", "video"], kinds
          print("OK:", r["video"])
          PY
