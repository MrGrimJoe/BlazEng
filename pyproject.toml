[build-system]
# Hatch rather than setuptools: this repo's setup.py is the interactive
# installer script, which setuptools would try to execute during a build.
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "blazeng"
dynamic = ["version"]
description = "BlazEng — prompt-to-video AI production studio (Godot or Blender rendering, ffmpeg assembly, OpenTimelineIO export)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "pyyaml>=6.0.1",
    "pydantic>=2.7.0",
    "requests>=2.32.0",
    "pillow>=10.0.0",
    "opentimelineio>=0.17.0",
    "google-genai>=2.0.0",
    "openai>=1.0.0",
    "anthropic>=1.0.0",
    "huggingface_hub>=0.25.0",
]

[project.optional-dependencies]
ui = ["PyQt6>=6.11.0"]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "PyQt6>=6.11.0"]

[project.scripts]
blazeng = "src.cli:main"

[tool.hatch.version]
path = "src/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src"]
# Blender runs blender_scene.py by file path, so it must ship as a data file.
include = ["src/**/*.py"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "config.yaml", "pyproject.toml"]
